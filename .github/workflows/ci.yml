name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://tripora:tripora@localhost:5432/tripora_test?schema=public
      TEST_DATABASE_URL: postgresql://tripora:tripora@localhost:5432/tripora_test?schema=public
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: tripora
          POSTGRES_PASSWORD: tripora
          POSTGRES_DB: tripora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripora -d tripora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy -w @tripora/api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -w @tripora/api -- --runInBand
      - run: npm run test -w @tripora/worker
      - run: python scripts/test-bandung-import.py
      - run: node --test scripts/backend-supervisor.test.cjs
      - run: npm run build -w @tripora/worker
      - run: node scripts/verify-reconciliation.cjs
      - run: npm run build -w @tripora/api
      - run: npm run build -w @tripora/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_DEMO_PAYMENTS: "false"

  docker:
    name: docker build (api · worker · web)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - run: docker build -f apps/api/Dockerfile -t tripora-api:ci .
      - run: docker build -f apps/worker/Dockerfile -t tripora-worker:ci .
      - run: docker build -f deploy/backend.Dockerfile -t tripora-backend:ci .
      - run: |
          docker build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000 \
            --build-arg NEXT_PUBLIC_DEMO_PAYMENTS=false \
            -t tripora-web:ci .

  cloudflare:
    name: Cloudflare Free build check
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:cloudflare -w @tripora/web
      - run: |
          cd apps/web
          npx wrangler deploy --dry-run --outdir .open-next/dry-run
          cd ../..
          node scripts/check-worker-size.cjs
