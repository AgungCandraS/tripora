name: Deploy Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: HTTPS origin of the deployed Tripora backend
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: tripora-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      API_URL: ${{ inputs.backend_url }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm ci
      - run: node scripts/configure-cloudflare.cjs
      - run: npm run build:cloudflare -w @tripora/web
      - name: Check Free plan bundle size
        run: |
          cd apps/web
          npx wrangler deploy --dry-run --outdir .open-next/dry-run
          cd ../..
          node scripts/check-worker-size.cjs
      - run: npm run deploy:cloudflare -w @tripora/web
