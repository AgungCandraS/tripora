services:
  - type: web
    name: tripora-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tripora-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: WEB_PUBLIC_BASE_URL
        sync: false
      - key: MAYAR_API_BASE
        value: https://api.mayar.id
      - key: MAYAR_SKIP_WEBHOOK_VERIFY
        value: "false"
  - type: keyvalue
    name: tripora-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []
